# ============================================================
# application-prod.yaml — Backend
# Ativado com: -Dspring.profiles.active=prod
#
# Nenhum valor sensível fica aqui. O que não é segredo vem de variável de
# ambiente; senha do banco, segredo do JWT e senha do primeiro ADMIN vêm de
# ARQUIVO, montados em /run/secrets pelo `secrets:` do
# docker-compose.prod.yml e lidos como config tree do Spring — onde o nome do
# arquivo é o nome da propriedade. Por isso as quatro propriedades abaixo
# aparecem só como comentário: quem as define é o arquivo montado.
#
# O `spring.config.import` que ativa isso está no compose, como
# SPRING_CONFIG_IMPORT, e NÃO aqui: import declarado em arquivo
# profile-specific (application-prod.yaml) não é aplicado — testado em
# 16/09/2026, o boot falha com "password authentication failed".
# ============================================================

spring:
  application:
    name: prontudigital

  datasource:
    url:      ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    # password: /run/secrets/spring.datasource.password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false           # nunca logar SQL em produção

  flyway:
    url:      ${SPRING_FLYWAY_URL}
    user:     ${SPRING_FLYWAY_USER}
    # password: /run/secrets/spring.flyway.password
    locations: classpath:db/migracoes
    baseline-on-migrate: false  # false em prod — migrações devem ser explícitas

server:
  port: 8080
  # Oculta informações do servidor nos headers HTTP
  server-header: ""
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # secret: /run/secrets/app.jwt.secret — sem default de propósito: faltando
    # o arquivo, o boot falha em JwtTokenProvider com "Could not resolve
    # placeholder 'app.jwt.secret'" em vez de assinar token com valor vazio.
    access-expiration-ms:  ${APP_JWT_ACCESS_EXPIRATION_MS}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS}
  # Primeiro ADMIN da instalacao. Sem default de proposito: uma senha padrao
  # em producao e o mesmo buraco que a antiga migracao de dados de exemplo
  # abria. Criado uma unica vez, no primeiro boot em que nao existe ADMIN
  # nenhum — ver BootstrapAdminRunner.
  bootstrap-admin:
    habilitado:    ${APP_BOOTSTRAP_ADMIN_HABILITADO:true}
    username:      ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    # Sobrescrita por /run/secrets/app.bootstrap-admin.senha. Vazia depois do
    # primeiro acesso: o arquivo secrets/admin.senha é esvaziado, não apagado
    # (§8.2 do DEPLOY.md), e senha vazia significa "não criar ADMIN nenhum".
    senha:         ""
    nome-completo: ${APP_BOOTSTRAP_ADMIN_NOME:Administrador}
    email:         ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    telefone:      ${APP_BOOTSTRAP_ADMIN_TELEFONE:}
  notificacoes:
    habilitadas: ${APP_NOTIFICACOES_HABILITADAS:false}
    url-base-confirmacao: ${APP_URL_BASE_CONFIRMACAO}
  whatsapp:
    cloud-api:
      base-url:        "https://graph.facebook.com"
      api-version:     "v25.0"
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token:    ${WHATSAPP_ACCESS_TOKEN:}
    webhook:
      verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
      app-secret:   ${WHATSAPP_APP_SECRET:}

logging:
  level:
    root:              WARN
    com.prontudigital: INFO   # logs de negócio mantidos
    com.prontudigital.backend.notificacao:            ${LOG_LEVEL_WHATSAPP:INFO}
    com.prontudigital.backend.compartilhado.clientes: ${LOG_LEVEL_WHATSAPP:INFO}

    # --------------------------------------------------------
    # Desligado EXPLICITAMENTE, um por um, porque `root: WARN`
    # não alcança nenhum deles.
    #
    # `application.yaml` (base, sempre carregado) declara estes
    # quatro loggers em DEBUG/TRACE para o dia a dia de
    # desenvolvimento. O merge de perfil não substitui o mapa
    # `logging.level` inteiro: ele une chave a chave, e
    # `logging.level.root` é uma chave diferente de
    # `logging.level.org.hibernate.SQL`. Sem as linhas abaixo, o
    # nível de desenvolvimento continua valendo em produção —
    # confirmado em 17/09/2026 com a stack no ar.
    #
    # O que isso causava:
    #   - toda query gravada no stdout, em produção. O
    #     `spring.jpa.show-sql: false` acima NÃO cobre este
    #     caminho: são dois caminhos distintos até o mesmo log.
    #   - BasicBinder em TRACE grava os PARÂMETROS de cada query:
    #     CPF, telefone e dado clínico em texto puro no log do
    #     container — o oposto do que o RNF01 pede.
    #   - volume: o teto de 50 MB por container da §3.4 do
    #     DEPLOY.md seria consumido em horas, não em semanas.
    #   - sob carga, escrever isso tudo em stdout vira parte do
    #     custo de cada requisição e contamina a medição.
    #
    # Para depurar SQL em produção (e só pelo tempo necessário):
    # suba LOG_LEVEL_SQL=DEBUG e recrie o container. O
    # BasicBinder segue fora disso de propósito — é ele que
    # despeja dado de paciente.
    # --------------------------------------------------------
    org.hibernate.SQL:                                ${LOG_LEVEL_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder:    WARN
    org.springframework.security:                     WARN
    org.springdoc:                                    WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ============================================================
# Actuator — health, metricas e scrape do Prometheus.
#
# Alcance: /actuator NAO e roteado pelo Caddy (o Caddyfile manda /api/* para o
# backend e todo o resto para o Next), entao nada aqui responde pelo dominio
# publico. A protecao que vale, porem, e a do SecurityConfig: /actuator/**
# exige ADMIN. Aberto fica so /actuator/health, chamado pelo healthcheck do
# container, que nao tem credencial.
#
# Para coletar durante um teste de carga, de dentro da VPS:
#   TOKEN=$(curl -s -X POST http://localhost/api/auth/login ... | jq -r .accessToken)
#   docker compose exec backend bash -c "..."   # ver testes-carga/README.md
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      # Detalhe do health expoe estado do banco e espaco em disco. O
      # healthcheck do container so precisa do "UP" agregado.
      show-details: never
  metrics:
    tags:
      application: prontudigital
    distribution:
      # Sem isto, http_server_requests traz media, contagem e maximo — e media
      # esconde exatamente a cauda que o RNF05 cobra. Com isto o p50/p95/p99 sai
      # por rota do proprio backend, comparavel com o que o k6 mede do lado de
      # fora: a diferenca entre os dois numeros e o custo de rede + Caddy.
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      # --------------------------------------------------------
      # `percentiles-histogram` e `slo` ficam FORA, e nao por
      # esquecimento: qualquer um dos dois transforma o timer num
      # histograma do Prometheus, e ai o exportador deixa de
      # emitir as linhas `quantile=` — um metric family nao pode
      # ser histogram e summary ao mesmo tempo. Testado nas tres
      # combinacoes em 17/09/2026 (Boot 3.5.3):
      #
      #   percentiles-histogram: true  -> 518 buckets, 0 quantile
      #   slo apenas                   ->  18 buckets, 0 quantile
      #   so percentiles               ->   0 buckets, p50/p95/p99
      #
      # A terceira e a que serve aqui: nao ha Prometheus no ar
      # para rodar histogram_quantile(), a leitura e um `curl` +
      # `grep`, e o numero que se quer comparar com o do k6 e o
      # percentil pronto.
      # --------------------------------------------------------

# Swagger desabilitado em produção
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
