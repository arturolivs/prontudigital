# ============================================================
# application-prod.yaml — Backend
# Ativado com: -Dspring.profiles.active=prod
#
# Nenhum valor sensível fica aqui. O que não é segredo vem de variável de
# ambiente; senha do banco, segredo do JWT e senha do primeiro ADMIN vêm de
# ARQUIVO, montados em /run/secrets pelo `secrets:` do
# docker-compose.prod.yml e lidos como config tree do Spring — onde o nome do
# arquivo é o nome da propriedade. Por isso as quatro propriedades abaixo
# aparecem só como comentário: quem as define é o arquivo montado.
#
# O `spring.config.import` que ativa isso está no compose, como
# SPRING_CONFIG_IMPORT, e NÃO aqui: import declarado em arquivo
# profile-specific (application-prod.yaml) não é aplicado — testado em
# 16/09/2026, o boot falha com "password authentication failed".
# ============================================================

spring:
  application:
    name: prontudigital

  datasource:
    url:      ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    # password: /run/secrets/spring.datasource.password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false           # nunca logar SQL em produção

  flyway:
    url:      ${SPRING_FLYWAY_URL}
    user:     ${SPRING_FLYWAY_USER}
    # password: /run/secrets/spring.flyway.password
    locations: classpath:db/migracoes
    baseline-on-migrate: false  # false em prod — migrações devem ser explícitas

server:
  port: 8080
  # Oculta informações do servidor nos headers HTTP
  server-header: ""
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # secret: /run/secrets/app.jwt.secret — sem default de propósito: faltando
    # o arquivo, o boot falha em JwtTokenProvider com "Could not resolve
    # placeholder 'app.jwt.secret'" em vez de assinar token com valor vazio.
    access-expiration-ms:  ${APP_JWT_ACCESS_EXPIRATION_MS}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS}
  # Primeiro ADMIN da instalacao. Sem default de proposito: uma senha padrao
  # em producao e o mesmo buraco que a antiga migracao de dados de exemplo
  # abria. Criado uma unica vez, no primeiro boot em que nao existe ADMIN
  # nenhum — ver BootstrapAdminRunner.
  bootstrap-admin:
    habilitado:    ${APP_BOOTSTRAP_ADMIN_HABILITADO:true}
    username:      ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    # Sobrescrita por /run/secrets/app.bootstrap-admin.senha. Vazia depois do
    # primeiro acesso: o arquivo secrets/admin.senha é esvaziado, não apagado
    # (§8.2 do DEPLOY.md), e senha vazia significa "não criar ADMIN nenhum".
    senha:         ""
    nome-completo: ${APP_BOOTSTRAP_ADMIN_NOME:Administrador}
    email:         ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    telefone:      ${APP_BOOTSTRAP_ADMIN_TELEFONE:}
  notificacoes:
    habilitadas: ${APP_NOTIFICACOES_HABILITADAS:false}
    url-base-confirmacao: ${APP_URL_BASE_CONFIRMACAO}
  whatsapp:
    cloud-api:
      base-url:        "https://graph.facebook.com"
      api-version:     "v25.0"
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token:    ${WHATSAPP_ACCESS_TOKEN:}
    webhook:
      verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
      app-secret:   ${WHATSAPP_APP_SECRET:}

logging:
  level:
    root:              WARN
    com.prontudigital: INFO   # logs de negócio mantidos
    com.prontudigital.backend.notificacao:            ${LOG_LEVEL_WHATSAPP:INFO}
    com.prontudigital.backend.compartilhado.clientes: ${LOG_LEVEL_WHATSAPP:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator — apenas health exposto (usado pelo healthcheck do Docker)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Swagger desabilitado em produção
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
