server:
  port: 9090

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authService
                fallbackUri: forward:/fallback/auth
        - id: auth-service-swagger
          uri: lb://auth-service
          predicates:
            - Path=/swagger-ui/**, /v3/api-docs/**
          filters:
            - StripPrefix=0
