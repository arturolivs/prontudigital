server:
  port: 9090

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8080  # Alterado para nome do container
          predicates:
            - Path=/api/auth/**
        - id: schedule-service
          uri: http://schedule-service:8081  # Adicionado schedule-service
          predicates:
            - Path=/api/schedule/**