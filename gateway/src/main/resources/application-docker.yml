server:
  port: 9090

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Internal-Auth, internal-auth-secret-123
        - id: schedule-service
          uri: http://schedule-service:8081
          predicates:
            - Path=/api/schedule/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Internal-Auth, internal-auth-secret-123

logging:
  level:
    org.springframework.cloud.gateway: DEBUG