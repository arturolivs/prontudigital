spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: schedule-service
  cloud:
    openfeign:
      # ✅ Configuração mínima
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 10000
            loggerLevel: basic

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  services:
    user-service:
      url: http://localhost:8080

logging:
  level:
    com.prontudigital.schedule: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    org.springframework.beans: WARN

