spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: user_admin
    password: secret123
  flyway:
    url: jdbc:postgresql://localhost:5432/auth_db
    user: user_admin
    password: secret123
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    access-expiration-ms: 600000000
    refresh-expiration-ms: 600000000

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

# Configurações CORS
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:3001

# Configuração para funcionar tanto direto quanto via gateway
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
    # Importante: config-url deve apontar para o endpoint correto
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs
    urls:
      - name: auth-service
        url: /v3/api-docs
    # Adicione esta linha para resolver problemas de CORS no Swagger UI
    csrf:
      enabled: false