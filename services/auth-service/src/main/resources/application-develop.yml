spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: user_admin
    password: secret123
  flyway:
    url: jdbc:postgresql://localhost:5432/auth_db
    user: user_admin
    password: secret123
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    access-expiration-ms: 600000000
    refresh-expiration-ms: 600000000

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

# Configurações CORS
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:3001
    - https://seusite.com

# Swagger/OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: /api/auth/v3/api-docs/swagger-config  # URL absoluta com prefixo
    url: /api/auth/v3/api-docs  # URL absoluta com prefixo
  api-docs:
    path: /v3/api-docs
