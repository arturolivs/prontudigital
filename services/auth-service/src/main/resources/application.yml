spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: user_admin
    password: secret123
    # url: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_USERS_DB}
    # username: ${POSTGRES_USER}
    # password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    url: jdbc:postgresql://localhost:5432/auth_db
    user: user_admin
    password: secret123
    log-level: DEBUG
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-on-validation-error: false


app:
  jwt:
    access-expiration-ms: 10000      # 15 minutos
    refresh-expiration-ms: 600000000  # 7 dias

logging:
  level:
    org:
      springframework:
        security: DEBUG
        jdbc:
          datasource:
            init:
              ScriptUtils: DEBUG
      hibernate:
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    flywaydb: DEBUG