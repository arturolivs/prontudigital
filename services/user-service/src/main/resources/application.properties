spring.application.name=user-service
logging.level.org.springframework.security=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/users_db
spring.datasource.username=user_admin
spring.datasource.password=users_db

#spring.datasource.url=jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_USERS_DB}
#spring.datasource.username=${POSTGRES_USER}
#spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 3) Flyway
spring.flyway.url=jdbc:postgresql://localhost:5432/users_db
spring.flyway.user=user_admin
spring.flyway.password=users_db
spring.flyway.log-level=DEBUG
logging.level.org.flywaydb=DEBUG
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=DEBUG
