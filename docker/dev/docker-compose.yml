# ============================================================
# Docker Compose — Desenvolvimento
#
# Uso:
#   cp .env.dev.example .env      # primeira vez
#   docker compose up             # sobe tudo
#   docker compose up backend     # sobe só um serviço
#   docker compose down -v        # derruba e limpa volumes
#
# Para depurar o backend no IntelliJ (backend fora do container):
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
#
# Entrada pela porta 9090 (Caddy), igual a produção:
#
#   http://localhost:9090   → app completo, same-origin (recomendado)
#   http://localhost:3000   → Next.js direto (o Caddy libera CORS p/ isto)
#   http://localhost:8080   → Spring direto, para debug
#   http://localhost:9090/swagger-ui/index.html → Swagger
#
# O Spring Cloud Gateway foi substituído pelo Caddy — ver Caddyfile.
# ============================================================

services:

  # ----------------------------------------------------------
  # Banco de dados PostgreSQL
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: prontudigital-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Mesmo fuso do backend: as colunas são TIMESTAMP (sem fuso) e vários
      # DEFAULT CURRENT_TIMESTAMP gravam pelo relógio do banco.
      TZ:   America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # exposto no host para uso com DBeaver/IntelliJ
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prontudigital-dev

  # ----------------------------------------------------------
  # Backend (monolito Spring Boot)
  # ----------------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    container_name: prontudigital-backend-dev
    restart: unless-stopped
    environment:
      # Sem isto a JVM roda em UTC e o @CreationTimestamp grava 3h à frente do
      # que o Clock da aplicação (America/Sao_Paulo) calcula — as janelas dos
      # schedulers nunca casam com o criado_em.
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FLYWAY_URL:          jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_FLYWAY_USER:         ${POSTGRES_USER}
      SPRING_FLYWAY_PASSWORD:     ${POSTGRES_PASSWORD}
      APP_JWT_ACCESS_EXPIRATION_MS:  ${JWT_ACCESS_EXPIRATION_MS}
      APP_JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      APP_JWT_SECRET:             ${JWT_SECRET}
      # Caminho ABSOLUTO, igual a produção. O default da aplicação
      # (`dados/anexos`) é relativo ao diretório de trabalho, o que fazia os
      # anexos caírem em lugares diferentes conforme quem estivesse servindo.
      ARMAZENAMENTO_DIR: /dados/anexos
      # Credenciais do número de TESTE da Meta (developers.facebook.com →
      # app → WhatsApp → Início rápido). Vazias = cliente desligado: o envio
      # lança IllegalStateException e o log grava FALHA, sem afetar o
      # agendamento.
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN:    ${WHATSAPP_ACCESS_TOKEN:-}
      # Webhook de status (sent/delivered/read/failed). Exige URL publica —
      # em dev, um tunel (ngrok/cloudflared) apontando para a 9090.
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET:           ${WHATSAPP_APP_SECRET:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Monta o código-fonte para hot reload via DevTools
      - ../../backend/src:/app/src
      - ../../backend/pom.xml:/app/pom.xml
      # Cache do Maven fora do container (builds mais rápidos)
      - maven_cache:/root/.m2
      # Anexos do prontuário — sem isto ficariam na camada gravável do
      # container e sumiriam a cada `up --build`, deixando no banco linhas
      # cujo arquivo não existe mais (download quebrado na tela do paciente).
      - anexos_data_dev:/dados/anexos
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prontudigital-dev

  # ----------------------------------------------------------
  # Caddy — proxy reverso (mesmo papel que em produção)
  #
  # Substituiu o Spring Cloud Gateway. Mantém a porta 9090 que o
  # gateway usava, então nenhuma URL do frontend precisou mudar.
  # ----------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: prontudigital-caddy-dev
    restart: unless-stopped
    ports:
      - "${CADDY_PORT:-9090}:9090"
    volumes:
      # :ro — o Caddyfile é editado no host, nunca pelo container
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    networks:
      - prontudigital-dev

  # ----------------------------------------------------------
  # Frontend Web
  # ----------------------------------------------------------
  frontend:
    build:
      context: ../../frontend-web
      dockerfile: Dockerfile.dev
    container_name: prontudigital-frontend-dev
    restart: unless-stopped
    environment:
      # Navegador: URL pública do Caddy (base, sem sufixo de caminho)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9090}
      # Servidor Next (Route Handlers): rede interna do Docker.
      # Aponta direto para o backend — passar pelo Caddy aqui seria
      # um salto de rede sem função, já que ambos estão na mesma rede.
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Hot reload: monta o projeto do host
      - ../../frontend-web:/app
      # Sombreia o node_modules do host (binários nativos do Windows não
      # rodam no Alpine). Volume NOMEADO de propósito: o Docker só o
      # popula a partir da imagem quando está vazio, então trocar o
      # package.json exige descartá-lo explicitamente —
      #   docker compose rm -sfv frontend
      #   docker compose up -d --build frontend
      # Nomeado (e não anônimo) para aparecer no `docker volume ls` com
      # um nome legível, em vez de um hash.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - prontudigital-dev

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  postgres_data_dev:
    name: prontudigital_postgres_dev
  maven_cache:
    name: prontudigital_maven_cache
  frontend_node_modules:
    name: prontudigital_frontend_node_modules
  anexos_data_dev:
    name: prontudigital_anexos_dev

# ----------------------------------------------------------
# Rede interna isolada
# ----------------------------------------------------------
networks:
  prontudigital-dev:
    name: prontudigital_dev_network
