# ============================================================
# Docker Compose — Produção
#
# Uso (a partir de docker/prod/):
#   cp .env.prod.example .env     # primeira vez — preencha TODOS os valores
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
#
# Ponto de entrada: Caddy (80/443), com TLS automático.
# O Spring Cloud Gateway foi removido — ver Caddyfile.
# ============================================================

services:

  # ----------------------------------------------------------
  # Banco de dados PostgreSQL
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: prontudigital-db
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Mesmo fuso do backend: as colunas são TIMESTAMP (sem fuso) e vários
      # DEFAULT CURRENT_TIMESTAMP gravam pelo relógio do banco.
      TZ:   America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - interna
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ----------------------------------------------------------
  # Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    image: prontudigital/backend:latest
    container_name: prontudigital-backend
    restart: always
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FLYWAY_URL:          jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_FLYWAY_USER:         ${POSTGRES_USER}
      SPRING_FLYWAY_PASSWORD:     ${POSTGRES_PASSWORD}
      APP_JWT_SECRET:                ${JWT_SECRET}
      APP_JWT_ACCESS_EXPIRATION_MS:  ${JWT_ACCESS_EXPIRATION_MS}
      APP_JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      ARMAZENAMENTO_DIR: /dados/anexos
      # Primeiro ADMIN. Usado só no boot em que o banco ainda não tem nenhum
      # ADMIN; nos seguintes o runner não faz nada. Depois do primeiro acesso
      # pode (e deve) sair do .env.
      APP_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_SENHA:    ${ADMIN_SENHA:-}
      APP_BOOTSTRAP_ADMIN_NOME:     ${ADMIN_NOME:-Administrador}
      APP_BOOTSTRAP_ADMIN_EMAIL:    ${ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_TELEFONE: ${ADMIN_TELEFONE:-}
      APP_NOTIFICACOES_HABILITADAS: ${NOTIFICACOES_HABILITADAS:-false}
      WHATSAPP_PHONE_NUMBER_ID:      ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN:         ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET:           ${WHATSAPP_APP_SECRET:-}
      APP_URL_BASE_CONFIRMACAO: https://${DOMINIO}/api/confirmacao
    expose:
      - "8080"
    volumes:
      - anexos_data:/dados/anexos
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  frontend:
    build:
      context: ../../frontend-web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_BASE_URL: https://${DOMINIO}
    image: prontudigital/frontend:latest
    container_name: prontudigital-frontend
    restart: always
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - interna
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  caddy:
    image: caddy:2-alpine
    container_name: prontudigital-caddy
    restart: always
    environment:
      DOMINIO: ${DOMINIO}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - frontend
    networks:
      - interna
      - externa
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  postgres_data:
    name: prontudigital_postgres_prod
  anexos_data:
    name: prontudigital_anexos_prod
  caddy_data:
    name: prontudigital_caddy_data
  caddy_config:
    name: prontudigital_caddy_config
  caddy_logs:
    name: prontudigital_caddy_logs

networks:
  interna:
    name: prontudigital_interna
    internal: true
  externa:
    name: prontudigital_externa
