services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PG_USERS_DB}
    volumes:
      - postgres:/data/postgres
    ports:
      - "${PG_PORT}:5432"
    restart: unless-stopped

volumes:
  postgres: