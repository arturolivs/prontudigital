version: '3.8'

services:
  # Banco para Auth Service
  postgres-auth:
    image: postgres:15
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Banco para Schedule Service
  postgres-schedule:
    image: postgres:15
    container_name: postgres-schedule
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: secret123
    ports:
      - "5433:5432"
    volumes:
      - postgres_schedule_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d schedule_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microserviços
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres-auth:5432/auth_db
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - microservices-net
    restart: on-failure

  schedule-service:
    build:
      context: ./services/schedule-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-schedule:5432/schedule_db
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres-schedule:5432/schedule_db
    depends_on:
      postgres-schedule:
        condition: service_healthy
    networks:
      - microservices-net
    restart: on-failure

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - schedule-service
    networks:
      - microservices-net

volumes:
  postgres_auth_data:
  postgres_schedule_data:

networks:
  microservices-net:
    driver: bridge